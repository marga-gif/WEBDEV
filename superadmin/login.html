<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuperAdmin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-brand">
        <button type="button" class="btn-back-to-user-login" title="Back to Admin Login">
          <i class="fas fa-arrow-left"></i>
        </button>
        <div class="brand-metallic-seal-bg"></div>
        <div class="brand-content">
          <h2>Barangay San Jose</h2>
          <p class="brand-subtitle">SuperAdmin Portal</p>
          <div class="brand-divider-line"></div>
          <span class="brand-portal-label">SuperAdmin Sign In</span>
        </div>
      </div>
      <div class="auth-forms">
        <div class="form-section active" id="login-section">
          <div class="form-header">
            <h3>Welcome Back</h3>
            <p>Enter your credentials to access the SuperAdmin console.</p>
          </div>
          <form id="superadmin-login-form">
            <div class="input-group">
              <label>Email Address</label>
              <div class="input-with-icon">
                <i class="fas fa-envelope"></i>
                <input type="email" id="login-email" placeholder="superadmin@barangay.gov.ph" required />
              </div>
            </div>
            <div class="input-group">
              <label>Password</label>
              <div class="input-with-icon">
                <i class="fas fa-lock"></i>
                <input type="password" id="login-password" placeholder="Enter your password" required />
                <button type="button" class="btn-toggle-password" data-target="login-password" title="Show/hide password">
                  <i class="fas fa-eye-slash"></i>
                </button>
              </div>
            </div>
            <div class="form-actions-row">
              <label class="remember-me-checkbox">
                <input type="checkbox" id="remember-me-checkbox" /> Remember Me
              </label>
            </div>
            <button type="submit" class="btn-auth-submit" id="btn-login">Sign In</button>
          </form>
          <div class="form-footer-switch">
            <p>Need SuperAdmin access? <a href="register.html" class="text-link-toggle">Create an account</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="api-config.js"></script>
  <script src="login.js"></script>
</body>
</html>
